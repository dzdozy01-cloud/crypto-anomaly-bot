name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff mypy
      - name: Ruff
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
        continue-on-error: true
      - name: Mypy
        run: mypy src/cadb --ignore-missing-imports
        continue-on-error: true

  file-modes:
    name: Shell scripts executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert deploy scripts are 100755 in git
        run: |
          # A non-executable deploy script means "Permission denied" for every
          # user who clones. This has regressed twice from tooling that rewrites
          # files without the exec bit, so it is enforced in CI.
          fail=0
          while read -r mode _ _ path; do
            case "$path" in
              *.sh)
                if [ "$mode" != "100755" ]; then
                  echo "::error file=$path::mode $mode; run 'git update-index --chmod=+x $path'"
                  fail=1
                fi
                ;;
            esac
          done < <(git ls-files -s)
          [ "$fail" -eq 0 ] && echo "All shell scripts are executable."
          exit "$fail"

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short --durations=10

  detection-quality:
    name: Detection quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Precision / recall report
        run: python -m cadb.cli evaluate
      - name: Enforce quality gates
        run: pytest tests/test_ml.py::TestDetectionQuality -v

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate config
        run: cadb validate -c config.yaml
      - name: Simulated run
        run: timeout 120 cadb demo --duration 60

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cadb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
