[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadb"
version = "1.0.0"
description = "Crypto Anomaly Detection Bot — unified exchange, on-chain, social and ML manipulation surveillance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CADB Contributors" }]
keywords = ["crypto", "anomaly-detection", "market-surveillance", "manipulation", "telegram-bot"]

dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Real-time exchange feeds (ccxt.pro ships inside ccxt >= 4)
exchange = ["ccxt>=4.2", "websockets>=12.0"]
# EVM helpers. The RPC layer works on raw JSON-RPC; web3 is only used for
# checksum addresses / ABI decoding when present.
onchain = ["web3>=6.11"]
# FinBERT. Without these the lexicon sentiment backend is used automatically.
nlp = ["transformers>=4.36", "torch>=2.1"]
# Redis Pub/Sub ingestion bus (falls back to the in-process bus when absent)
redis = ["redis>=5.0"]
speed = ["orjson>=3.9", "uvloop>=0.19; sys_platform != 'win32'"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.1", "mypy>=1.8"]
all = [
    "ccxt>=4.2", "websockets>=12.0", "web3>=6.11",
    "transformers>=4.36", "torch>=2.1", "redis>=5.0", "orjson>=3.9",
]

[project.scripts]
cadb = "cadb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cadb = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = [
    "B008",     # function call in default arg — intentional for Field(...)
    "E501",     # line length handled by the formatter
    "UP042",    # `str, Enum` is deliberate: keeps values JSON-serialisable
    "B027",     # empty non-abstract methods are optional lifecycle hooks
    "ASYNC240", # sync pathlib in async fns is fine for small local file I/O
    "B905",     # zip(strict=) — sequences are length-matched by construction
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
